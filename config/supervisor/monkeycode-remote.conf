[unix_http_server]
file=/run/monkeycode-remote/supervisor.sock
chmod=0700
chown=root:root

[supervisord]
logfile=/var/log/monkeycode-remote/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/run/monkeycode-remote/supervisord.pid
childlogdir=/var/log/monkeycode-remote
nodaemon=false
minfds=1024
minprocs=200
strip_ansi=true

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/monkeycode-remote/supervisor.sock

[program:cloudflared]
command=/usr/local/bin/cloudflared --no-autoupdate tunnel run --token-file /etc/cloudflared/token
directory=/workspace
user=root
autostart=true
autorestart=true
startsecs=10
startretries=30
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/monkeycode-remote/cloudflared.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=HOME="/root",USER="root"

[program:sshd]
command=/usr/sbin/sshd -D -e -f /etc/ssh/sshd_config
user=root
autostart=false
autorestart=true
startsecs=3
startretries=10
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/monkeycode-remote/sshd.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
