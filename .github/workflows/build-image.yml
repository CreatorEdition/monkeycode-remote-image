name: 构建并发布镜像

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/creatoredition/monkeycode-remote-image

jobs:
  build:
    name: 检查并构建 linux/amd64
    runs-on: ubuntu-24.04

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 检查 Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: 检查 Shell 脚本
        run: |
          shellcheck scripts/*.sh
          for script in scripts/*.sh; do
            sh -n "$script"
          done

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=sha-
            type=ref,event=pr
            type=schedule,pattern={{date 'YYYYMMDD'}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=MonkeyCode remote workspace with latest Node.js LTS and cloudflared

      - name: 构建并按条件发布
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: 运行镜像冒烟测试
        if: github.event_name == 'pull_request'
        env:
          TEST_IMAGE: ${{ env.IMAGE_NAME }}:pr-${{ github.event.number }}
        run: |
          docker run --rm --entrypoint /bin/sh "$TEST_IMAGE" -ec '
            test "$(id -u)" -eq 0
            command -v node
            command -v npm
            command -v cloudflared
            command -v supervisord
            command -v sshd
            test "$(node -p process.release.lts)" != "undefined"
            test ! -e /etc/cloudflared/token
            test -z "$(find /etc/ssh -maxdepth 1 -type f -name "ssh_host_*_key" -print -quit)"
            ssh-keygen -A
            sshd -t
            printf "%s\n" "dummy-ci-token" | install-cloudflared-token
            test "$(stat -c "%a" /etc/cloudflared/token)" = "600"
          '

      - name: 写入构建摘要
        if: github.event_name != 'pull_request'
        run: |
          {
            echo '## MonkeyCode 镜像'
            echo
            echo '`'"${IMAGE_NAME}@${{ steps.build.outputs.digest }}"'`'
            echo
            echo '请在确认 GHCR 匿名可拉取后，将以上 digest 绑定到 MonkeyCode。'
          } >> "$GITHUB_STEP_SUMMARY"
