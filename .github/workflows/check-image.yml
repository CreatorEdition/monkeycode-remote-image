name: 检查镜像

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-image-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/creatoredition/monkeycode-remote-image

jobs:
  check:
    name: 检查并构建 linux/amd64
    runs-on: ubuntu-24.04

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 检查 Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: 检查 Shell 脚本
        run: |
          shellcheck scripts/*.sh
          for script in scripts/*.sh; do
            sh -n "$script"
          done

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=MonkeyCode remote workspace with latest Node.js LTS and cloudflared

      - name: 构建并载入检查镜像
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: 运行镜像冒烟测试
        env:
          TEST_IMAGE: ${{ env.IMAGE_NAME }}:pr-${{ github.event.number }}
        run: docker run --rm -i --entrypoint /bin/sh "$TEST_IMAGE" -s < scripts/ci-image-smoke-test.sh
